[project]
name = "nanomix"
version = "0.1.0"
description = "Pretraining data mix and a ~124M GPT trained on it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ai2-olmo-core>=3.0.0",
    "boto3>=1.43.110",
    "hf-xet>=1.7.0",
    "huggingface-hub>=1.0,<2",
    "lm-eval[hf]==0.4.13",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "wandb>=0.31.0",
]

[project.scripts]
# Data: download -> tokenize -> mix (each step reads only the previous step's output)
nanomix-download = "nanomix.data.download:main"
nanomix-verify-download = "nanomix.data.verify_download:main"
nanomix-tokenize = "nanomix.data.tokenize_data:main"
nanomix-verify-tokenized = "nanomix.data.verify_tokenized:main"
nanomix-mix = "nanomix.data.mix:main"
nanomix-verify-mix = "nanomix.data.verify_mix:main"
nanomix-trim-mix = "nanomix.data.trim_mix:main"
# Train
nanomix-train = "nanomix.train.cli:main"
# Eval
nanomix-make-eval-sets = "nanomix.eval.make_eval_sets:main"
nanomix-eval-bpb = "nanomix.eval.bpb:main"
nanomix-export-hf = "nanomix.eval.export_hf:main"
nanomix-benchmarks = "nanomix.eval.benchmarks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanomix"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
